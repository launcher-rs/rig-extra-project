[package]
name = "skills_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-extra = { path = "../../rig-extra", features = ["rig-extra-skills", "rig-extra-tools"] }
rig-core = "0.31"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
config = "0.15"
tracing-subscriber = "0.3"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1.0"
