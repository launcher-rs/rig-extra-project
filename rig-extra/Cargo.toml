[package]
name = "rig-extra"
version = "0.20.0"
edition = "2024"
authors = ["cyberdoors"]
keywords = ["rig-core-extra", "bigmodel","rig-core"]
description = "基于rig-core的简单扩展"
repository = "https://github.com/launcher-rs/rig-extra-project"
license = "MIT"


[dependencies]
#rig-core = { git = "https://github.com/0xPlaygrounds/rig.git",optional = true,default-features = false }
rig-core = { version = "0.31.0",optional = true,default-features = false }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13",default-features = false, features = ["json", "stream", "multipart", "query"] }
serde_json = "1"
tracing = "0.1.41"
rand = "0.9"
thiserror = "2"
tokio = {version = "1",features = ["full"]}
strum_macros = "0.27.1"
backon = "1.6.0"
schemars = "1.0.4"

bytes = "1.10.1"

# skills deps
anyhow = { version = "1.0", optional = true }
regex = { version = "1.10", optional = true }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }

# tools-only deps, make optional and enable via feature rig-extra-tools
chrono = { version = "0.4.42", optional = true }
tyme4rs = { version = "1.3.3", optional = true }
scraper = { version = "0.24.0", optional = true }
tavily2 = { version = "0.1.0",optional = true }

http = "1.3.1"
futures = "0.3.31"

# 使用feature ,将 rig-core导入
[features]
default = ["rig-core/default"]
rig-all = ["rig-core/all"]
rig-audio = ["rig-core/audio"]
rig-image = ["rig-core/image"]
rig-derive = ["rig-core/derive"]
rig-experimental  = ["rig-core/experimental"]
rig-discord-bot  = ["rig-core/discord-bot"]
rig-pdf = ["rig-core/pdf"]
rig-epub = ["rig-core/epub"]
rig-rayon = ["rig-core/rayon"]
rig-wasm  = ["rig-core/wasm"]
rig-rmcp = ["rig-core/rmcp"]
rig-socks = ["rig-core/socks"]
rig-reqwest-native-tls = ["rig-core/reqwest-native-tls"]
rig-reqwest-rustls = [
    "reqwest/rustls",
    "reqwest/charset",
    "reqwest/http2",
]
rig-reqwest-middleware = ["rig-core/reqwest-middleware"]
rig-reqwest-middleware-rustls = ["rig-core/reqwest-middleware-rustls"]

# Enable tools module and its dependencies
rig-extra-tools = [
    "chrono",
    "tyme4rs",
    "scraper",
    "tavily2"
]

# Enable skills module (includes audit which uses regex)
rig-extra-skills = [
    "anyhow",
    "regex",
    "serde_yaml",
    "toml",
    "rig-core",  # 需要 rig-core 来使用 Tool trait
]

[dev-dependencies]
config = "0.15"
tempfile = "3"
